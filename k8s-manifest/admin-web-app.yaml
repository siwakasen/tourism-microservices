apiVersion: v1
kind: Service
metadata:
  name: admin-web-app
spec:
  type: ClusterIP
  selector:
    app: admin-web-app
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web-app
  labels:
    app: admin-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-web-app
  template:
    metadata:
      labels:
        app: admin-web-app
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: admin-web-app
          image: 
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
