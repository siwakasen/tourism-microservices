syntax = "proto3";

package bookings;

service BookingsGrpcService {
  rpc GetCarIdsByBookingDateRange (BookingDateRangeRequest) returns (CarIdsResponse);
  rpc GetEmployeesByBookingDateRange (BookingDateRangeRequest) returns (EmployeeIdsResponse);
}

message BookingDateRangeRequest {
  string start_date = 1;
  string end_date = 2;
  int32 booking_id = 3;
}

message CarIdsResponse {
  repeated int32 car_ids = 1;
}

message EmployeeIdsResponse{
  repeated int32 employee_ids = 1;
}
