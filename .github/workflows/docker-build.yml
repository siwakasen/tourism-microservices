            )
          )
        run: |
          IMAGE=${{ secrets.REGISTRY_URL }}/transaction-service
          docker build --progress=plain  -f Dockerfile.transaction -t $IMAGE:latest -t $IMAGE:sha-${SHORT_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}

      # ----------------------------------------
      # Travel Packages SERVICE
      # ----------------------------------------
      - name: Build and push travel-packages-service image
        if: |
          env.skip == 'false' &&
          (
            contains(env.COMMIT_MESSAGE, 'build:') &&
            (
              contains(env.COMMIT_MESSAGE, 'travel-packages,') ||
