name: Build and Push Docker Images

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  determine-services:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.determine-services.outputs.skip }}
      services: ${{ steps.determine-services.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare environment variables
        id: vars
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=${COMMIT_MESSAGE}" >> $GITHUB_ENV

      - name: Check for skip keywords and determine services
        id: determine-services
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          SERVICES=()
          SKIP="false"

          # Check for skip keywords
          if echo "${COMMIT_MSG}" | grep -qE "(skip:build|ci:skip)"; then
            SKIP="true"
            echo "Skipping workflow because commit contains skip keyword."
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "services=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

          # Check if commit message contains 'build:' keyword
          if echo "${COMMIT_MSG}" | grep -q "build:"; then
            # Check each service (only once per service)
            if echo "${COMMIT_MSG}" | grep -qE "(customer,|,customer)"; then
              SERVICES+=("customer")
            fi
            if echo "${COMMIT_MSG}" | grep -qE "(employees,|,employees)"; then
              SERVICES+=("employees")
            fi
            if echo "${COMMIT_MSG}" | grep -qE "(expenses,|,expenses)"; then
              SERVICES+=("expenses")
            fi
            if echo "${COMMIT_MSG}" | grep -qE "(live-chat,|,live-chat)"; then
              SERVICES+=("live-chat")
            fi
            if echo "${COMMIT_MSG}" | grep -qE "(rent-car,|,rent-car)"; then
              SERVICES+=("rent-car")
            fi
            if echo "${COMMIT_MSG}" | grep -qE "(report,|,report)"; then
              SERVICES+=("report")
            fi
            if echo "${COMMIT_MSG}" | grep -qE "(transaction,|,transaction)"; then
              SERVICES+=("transaction")
            fi
            if echo "${COMMIT_MSG}" | grep -qE "(travel-packages,|,travel-packages)"; then
              SERVICES+=("travel-packages")
            fi
          else
            # If commit message doesn't contain 'build:', build all services
            SERVICES=("customer" "employees" "expenses" "live-chat" "rent-car" "report" "transaction" "travel-packages")
            echo "Commit message doesn't contain 'build:', building all services"
          fi

          # Convert array to JSON array
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            SERVICES_JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s .)
            echo "services=${SERVICES_JSON}" >> $GITHUB_OUTPUT
            echo "Services to build: ${SERVICES[*]}"
          fi

  build-and-push:
    needs: determine-services
    if: needs.determine-services.outputs.should-skip != 'true' && needs.determine-services.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.services) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare environment variables
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Log in to Registry
        run: |
          echo ${{ secrets.REGISTRY_TOKEN }} | docker login \
            -u ${{ secrets.REGISTRY_USER }} \
            --password-stdin ${{ secrets.REGISTRY_URL }}

      - name: Build and push ${{ matrix.service }} image
        run: |
          SERVICE_NAME="${{ matrix.service }}"
          IMAGE=${{ secrets.REGISTRY_URL }}/${SERVICE_NAME}-service
          
          # Map service name to Dockerfile
          case "$SERVICE_NAME" in
            customer)
              DOCKERFILE="Dockerfile.customer"
              ;;
            employees)
              DOCKERFILE="Dockerfile.employees"
              ;;
            expenses)
              DOCKERFILE="Dockerfile.expenses"
              ;;
            live-chat)
              DOCKERFILE="Dockerfile.live-chat"
              ;;
            rent-car)
              DOCKERFILE="Dockerfile.rent-car"
              ;;
            report)
              DOCKERFILE="Dockerfile.report"
              ;;
            transaction)
              DOCKERFILE="Dockerfile.transaction"
              ;;
            travel-packages)
              DOCKERFILE="Dockerfile.travel-packages"
              ;;
            *)
              echo "Unknown service: $SERVICE_NAME"
              exit 1
              ;;
          esac
          
          docker build --progress=plain -f "$DOCKERFILE" -t "$IMAGE:latest" -t "$IMAGE:sha-${SHORT_SHA}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${SHORT_SHA}"

      - name: Logout from Registry
        if: always()
        run: |
          docker logout

