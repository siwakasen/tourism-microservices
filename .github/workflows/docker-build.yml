              contains(env.COMMIT_MESSAGE, 'expenses,') ||
              contains(env.COMMIT_MESSAGE, ',expenses')
            )
          )
        run: |
          IMAGE=${{ secrets.REGISTRY_URL }}/expenses-service
          docker build --progress=plain  -f Dockerfile.expenses -t $IMAGE:latest -t $IMAGE:sha-${SHORT_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}
      
      # ----------------------------------------
      # LIVE CHAT SERVICE
      # ----------------------------------------
      - name: Build and push live-chat-service image
        if: |
          env.skip == 'false' &&
          (
            contains(env.COMMIT_MESSAGE, 'build:') &&
            (
              contains(env.COMMIT_MESSAGE, 'live-chat,') ||
              contains(env.COMMIT_MESSAGE, ',live-chat')
            )
          )
        run: |
          IMAGE=${{ secrets.REGISTRY_URL }}/live-chat-service
          docker build --progress=plain  -f Dockerfile.live-chat -t $IMAGE:latest -t $IMAGE:sha-${SHORT_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}

      # ----------------------------------------
      # RENT CAR SERVICE
      # ----------------------------------------
      - name: Build and push rent-car-service image
        if: |
          env.skip == 'false' &&
          (
            contains(env.COMMIT_MESSAGE, 'build:') &&
            (
              contains(env.COMMIT_MESSAGE, 'rent-car,') ||
              contains(env.COMMIT_MESSAGE, ',rent-car')
            )
          )
        run: |
          IMAGE=${{ secrets.REGISTRY_URL }}/rent-car-service
          docker build --progress=plain  -f Dockerfile.rent-car -t $IMAGE:latest -t $IMAGE:sha-${SHORT_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}

      # ----------------------------------------
      # REPORT SERVICE
      # ----------------------------------------
      - name: Build and push report-service image
        if: |
          env.skip == 'false' &&
          (
            contains(env.COMMIT_MESSAGE, 'build:') &&
            (
              contains(env.COMMIT_MESSAGE, 'report,') ||
              contains(env.COMMIT_MESSAGE, ',report')
            )
          )
        run: |
          IMAGE=${{ secrets.REGISTRY_URL }}/report-service
          docker build --progress=plain  -f Dockerfile.report -t $IMAGE:latest -t $IMAGE:sha-${SHORT_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}

      # ----------------------------------------
      # Transaction SERVICE
      # ----------------------------------------
