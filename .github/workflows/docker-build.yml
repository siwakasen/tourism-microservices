            )
          )
        run: |
          IMAGE=${{ secrets.REGISTRY_URL }}/travel-packages-service
          docker build --progress=plain  -f Dockerfile.travel-packages -t $IMAGE:latest -t $IMAGE:sha-${SHORT_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:sha-${SHORT_SHA}
      
      - name: Logout from Registry
        if: env.skip == 'false'
        run: |
          docker logout


